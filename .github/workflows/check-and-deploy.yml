name: Check and deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Regression and Worker checks
    # Validate releases, including dev -> main PRs. Dev stays fast for manual testing.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Check Worker bundle and local database integration
        run: npm run test:worker

  deploy:
    name: Deploy selected environment
    needs: checks
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      vars.XEVENTS_DEPLOY_ENABLED == 'true' &&
      ((github.ref == 'refs/heads/main' && needs.checks.result == 'success') ||
      (github.ref == 'refs/heads/dev' && needs.checks.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    # The development schema-refresh job uses this same resource lock.
    concurrency:
      group: ${{ github.ref_name == 'main' && 'xevents-production' || 'xevents-development' }}
      cancel-in-progress: false
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject a superseded deployment
        run: |
          REMOTE_COMMIT="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [ "$REMOTE_COMMIT" != "$GITHUB_SHA" ]; then
            echo 'Deployment superseded by a newer branch commit. Deploy the latest commit instead.' >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations and deploy to the selected environment
        env:
          DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          GH_REF_NAME: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG_JSON: ${{ secrets.WRANGLER_CONFIG_JSON }}
          # Used only to reject an accidental production binding in development.
          PRODUCTION_CONFIG_JSON: ${{ github.ref_name == 'dev' && secrets.PRODUCTION_CONFIG_JSON || '' }}
        run: node scripts/deploy-environment.mjs
