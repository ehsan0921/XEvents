name: Copy production database to dev

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-database:
    name: Replace dev data with a production snapshot
    if: vars.XEVENTS_DATABASE_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This environment is restricted to main. It has its own private credentials.
    environment:
      name: development-refresh
    concurrency:
      group: xevents-development
      cancel-in-progress: false
    steps:
      - name: Require the trusted workflow branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != 'refs/heads/main' ]; then
            echo 'Run this database-only workflow from main.' >&2
            exit 1
          fi
      - name: Check out the database-copy tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the current development migrations
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev
          path: .wrangler/development-code
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install database tools
        run: npm ci
      - name: Copy production data into development only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG_JSON: ${{ secrets.WRANGLER_CONFIG_JSON }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
        run: node scripts/copy-production-database.mjs
