name: Sync production code to development

on:
  workflow_dispatch:
    inputs:
      copy_database_schema:
        description: Also copy production schema into an empty development database (no user data)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: xevents-sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync-code:
    name: Merge main into dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require the main branch
        env:
          SELECTED_REF: ${{ github.ref }}
          COPY_DATABASE_SCHEMA: ${{ inputs.copy_database_schema }}
          DEPLOY_ENABLED: ${{ vars.XEVENTS_DEPLOY_ENABLED }}
        run: |
          if [ "$SELECTED_REF" != 'refs/heads/main' ]; then
            echo 'Run this workflow from main. Other source branches are not allowed.' >&2
            exit 1
          fi
          if [ "$COPY_DATABASE_SCHEMA" = 'true' ] && [ "$DEPLOY_ENABLED" != 'true' ]; then
            echo 'Schema copying is available only in the repository enabled for deployment.' >&2
            exit 1
          fi
      - name: Check out production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Merge production changes without discarding development work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main dev
          git switch --create dev --track origin/dev
          git merge --no-edit origin/main
          git push origin HEAD:refs/heads/dev

  refresh-schema:
    name: Copy schema to empty development D1
    needs: sync-code
    if: inputs.copy_database_schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Restrict this environment to main in the repository environment settings.
    environment:
      name: development-refresh
    concurrency:
      group: xevents-development
      cancel-in-progress: false
    steps:
      - name: Check out the trusted refresh script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Copy schema without copying production records
        env:
          DEPLOY_ENVIRONMENT: development
          GH_REF_NAME: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG_JSON: ${{ secrets.WRANGLER_CONFIG_JSON }}
          PRODUCTION_CONFIG_JSON: ${{ secrets.PRODUCTION_CONFIG_JSON }}
        run: node scripts/refresh-development.mjs

  check-development:
    name: Start development checks and deployment
    needs: [sync-code, refresh-schema]
    if: >-
      always() && needs.sync-code.result == 'success' &&
      ((!inputs.copy_database_schema && needs.refresh-schema.result == 'skipped') ||
      (inputs.copy_database_schema && needs.refresh-schema.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # A push made with GITHUB_TOKEN does not trigger another push workflow.
      - name: Explicitly dispatch development checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check-and-deploy.yml --ref dev --repo "$GITHUB_REPOSITORY"
